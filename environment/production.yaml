# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: paty.renartcarnicero@mongodb.com

env:
  NODE_ENV: prod
  AWS_REGION: us-east-1
  # Backend API URL for frontend to connect to backend health check
  BACKEND_URL: http://ins-fraud-detection-backend-prod-web-app:80 # or http://localhost:8000 if multicontainer pod is setup and backend is running on 8000

## Single Pod Containers
envSecrets:

  # MongoDB Configuration
  MONGODB_URI: ins-agentic-fraud-detection-secrets
  DATABASE_NAME: ins-agentic-fraud-detection-secrets

  AGENT_BASE_URL: ins-agentic-fraud-detection-secrets
  FRAUD_AGENT_API_KEY: ins-agentic-fraud-detection-secrets
  FRAUD_AGENT_WORKSPACE_ID: ins-agentic-fraud-detection-secrets
  FRAUD_AGENT_PROJECT_ID: ins-agentic-fraud-detection-secrets

  VOYAGE_MODEL: ins-agentic-fraud-detection-secrets
  VOYAGE_API_KEY: ins-agentic-fraud-detection-secrets



## Add IRSA configuration here, this is for AWS
serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"

